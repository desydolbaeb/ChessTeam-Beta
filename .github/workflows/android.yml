name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Export Android APK
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: Android
          cache: true

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find "${{ steps.export.outputs.build_directory }}" -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" TeamChess2x2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TeamChess2x2-APK
          path: TeamChess2x2.apk
